<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE-агент: консоль</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1c2230; --muted: #667085; --line: #e2e5eb;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3a;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #232835;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3a;
    --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #232835;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  main { padding: 16px; display: grid; gap: 16px; max-width: 1400px; margin: 0 auto; }
  .cols { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  a.ghost { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.run { color: var(--accent); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 360px; overflow: auto; font-size: 12.5px; margin: 6px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  /* runs list */
  #runs { display: grid; gap: 6px; margin-top: 10px; }
  button.run { text-align: left; display: grid; gap: 2px; background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.run.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .runhyp { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  /* run detail */
  .dhead { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; }
  .verdict { margin: 10px 0; padding: 8px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
  /* iterations: collapsed by default, one line each */
  details.it { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: var(--panel); }
  details.it > summary { cursor: pointer; padding: 8px 10px; display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; list-style: none; }
  details.it > summary::-webkit-details-marker { display: none; }
  .num { font-weight: 600; color: var(--muted); }
  .hyp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  details.it .body { padding: 4px 12px 12px 12px; border-top: 1px solid var(--line); }
  details.it .body p { margin: 8px 0; }
  details.sub { margin: 8px 0; }
  details.sub > summary { cursor: pointer; color: var(--accent); }
  ul.plain { margin: 4px 0; padding-left: 18px; }
  .action { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 8px 0; background: var(--bg); border-radius: 0 6px 6px 0; }
  ul.checks { list-style: none; padding-left: 0; margin: 4px 0; font-size: 13px; }
  /* approvals and mode */
  .appr { border: 1px solid var(--warn); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .modes { display: flex; gap: 6px; flex-wrap: wrap; }
  .allowed { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
           padding: 8px 14px; border-radius: 8px; max-width: 90vw; z-index: 5; }
  .toast.bad { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <h1><span id="health" class="dot" title="готовность агента"></span> SRE-агент</h1>
  <div class="row">
    <input id="by" placeholder="ваше имя (для аудита)" size="20" aria-label="имя для аудита">
    <input id="token" type="password" placeholder="токен агента (если задан)" size="20" aria-label="токен агента">
  </div>
</header>

<main>
  <section id="approvals" class="card hidden" aria-live="polite"></section>

  <section class="card">
    <div class="row" style="justify-content: space-between">
      <div><h2>Режим действий</h2><div class="muted">Потолок для всех действий. Эффективный режим каждого действия — более строгий из потолка и своего.</div></div>
      <div id="modes" class="modes"></div>
    </div>
    <div id="allowed" class="allowed"></div>
  </section>

  <div class="cols">
    <aside class="card">
      <div class="row">
        <button id="runNow">Проверить сейчас</button>
        <button id="incident" class="ghost">Объявить инцидент</button>
      </div>
      <div id="runs"><p class="muted">Загрузка…</p></div>
    </aside>
    <section id="detail" class="card"><p class="muted">Выберите запуск слева.</p></section>
  </div>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtTime = (t) => (t ? new Date(t).toLocaleTimeString('ru-RU') : '—');
  const TRIGGER = { Alert: 'алерт', Schedule: 'по расписанию', Manual: 'вручную', Incident: 'инцидент' };
  const OUTCOME = { Resolved: 'решено', LimitsExhausted: 'лимит итераций', Escalated: 'эскалация', Failed: 'ошибка', Cancelled: 'отменён' };
  const MODES = ['DryRun', 'Approve', 'Auto'];
  const MODE_TEXT = { DryRun: 'только описывать', Approve: 'с вашим одобрением', Auto: 'автоматически' };

  let selected = null;
  const openKeys = new Set();   // which iteration / sub-block cards are expanded (survives refreshes)
  let toastTimer = null;

  // Per-viewer conveniences only: the token stays in this tab, the name remembers itself.
  const load = (store, key) => { try { return store.getItem(key) ?? ''; } catch { return ''; } };
  const save = (store, key, v) => { try { store.setItem(key, v); } catch { /* private window: fine */ } };
  $('#token').value = load(sessionStorage, 'agent-token');
  $('#by').value = load(localStorage, 'agent-by');
  $('#token').addEventListener('input', (e) => save(sessionStorage, 'agent-token', e.target.value));
  $('#by').addEventListener('input', (e) => save(localStorage, 'agent-by', e.target.value));

  function toast(msg, bad = false) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
  }

  async function api(method, path, body) {
    const headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    const token = $('#token').value.trim();
    if (token) headers['X-Agent-Token'] = token;
    try {
      const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      return { ok: res.ok, status: res.status, data };
    } catch (e) {
      return { ok: false, status: 0, data: { error: 'агент недоступен: ' + e.message } };
    }
  }

  const statusText = (r) => (r.status === 'finished' ? (OUTCOME[r.outcome] ?? r.outcome ?? 'завершён')
    : r.status === 'running' ? 'идёт' : 'в очереди');
  const statusClass = (r) => (r.status !== 'finished' ? 'chip run'
    : r.outcome === 'Resolved' ? 'chip ok' : (r.outcome === 'Escalated' || r.outcome === 'Failed') ? 'chip bad' : 'chip warn');

  // Keyboard/mouse expansion state: remember it per card, so a refresh doesn't close what you opened.
  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
    if (d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key);
  }, true);
  const openAttr = (key) => (openKeys.has(key) ? ' open' : '');

  async function renderHealth() {
    const r = await api('GET', '/health/ready');
    const dot = $('#health');
    dot.className = 'dot ' + (r.ok ? 'ok' : 'bad');
    dot.title = r.ok ? 'агент готов' : 'агент не отвечает';
  }

  async function renderMode() {
    const r = await api('GET', '/actions');
    const modes = $('#modes');
    const allowed = $('#allowed');
    if (!r.ok) { modes.innerHTML = `<span class="muted">${esc(r.data?.error ?? 'нет данных')}</span>`; allowed.innerHTML = ''; return; }
    if (!r.data.mode) {
      modes.innerHTML = '';
      allowed.innerHTML = `<span class="muted">${esc(r.data.reason ?? 'действий нет: агент только наблюдает')}</span>`;
      return;
    }
    modes.innerHTML = MODES.map((m) => `<button data-mode="${m}" aria-pressed="${r.data.mode === m}" class="${r.data.mode === m ? '' : 'ghost'}"
      title="${esc(MODE_TEXT[m])}">${m}</button>`).join('');
    const entries = Object.entries(r.data.allowed ?? {});
    allowed.innerHTML = entries.map(([type, eff]) => `<span class="chip">${esc(type)}: <b>${esc(eff)}</b></span>`).join('')
      || '<span class="muted">нет разрешённых действий</span>';
  }

  async function setMode(mode) {
    if (mode === 'Auto' && !confirm('Автоматический режим: агент сможет выполнять разрешённые действия (перезапуск Deployment, удаление пода в sandbox) без вашего одобрения. Включить?')) return;
    const r = await api('PUT', '/actions/mode', { mode, by: $('#by').value.trim() || 'console' });
    if (r.ok) toast(`Потолок: ${r.data.previous} → ${r.data.mode}`);
    else toast(r.data?.error ?? `ошибка ${r.status}`, true);
    renderMode();
  }

  async function renderApprovals() {
    const r = await api('GET', '/approvals');
    const list = Array.isArray(r.data) ? r.data : [];
    const box = $('#approvals');
    box.classList.toggle('hidden', list.length === 0);
    box.innerHTML = list.length ? `<h2>Ждут вашего решения (${list.length})</h2>` + list.map((a) => `
      <div class="appr">
        <div><b>${esc(a.proposal.type)}</b> → <code>${esc(a.proposal.target)}</code> · запуск <code>${esc(a.runId)}</code>, итерация ${a.iteration} · до ${fmtTime(a.expiresAt)}</div>
        <div class="muted">${esc(a.proposal.reason)}</div>
        <div class="row" style="margin-top:6px">
          <button data-approve="${esc(a.id)}" data-v="true">Одобрить</button>
          <button class="danger" data-approve="${esc(a.id)}" data-v="false">Отклонить</button>
        </div>
      </div>`).join('') : '';
  }

  async function decide(id, approve) {
    const by = $('#by').value.trim();
    if (!by) { toast('Укажите имя: оно попадёт в аудит', true); $('#by').focus(); return; }
    const r = await api('POST', `/approvals/${encodeURIComponent(id)}`, { approve, by });
    toast(r.ok ? (approve ? 'Одобрено' : 'Отклонено') : (r.data?.error ?? `ошибка ${r.status}`), !r.ok);
    renderApprovals();
  }

  async function renderRuns() {
    const r = await api('GET', '/runs');
    const runs = Array.isArray(r.data) ? r.data : [];
    if (!selected && runs.length) selected = runs[0].id;
    $('#runs').innerHTML = !r.ok ? `<p class="bad">${esc(r.data?.error ?? 'нет связи')}</p>`
      : runs.length ? runs.map((run) => `
        <button class="run ${run.id === selected ? 'sel' : ''}" data-run="${esc(run.id)}">
          <span class="${statusClass(run)}" style="justify-self:start">${esc(statusText(run))}</span>
          <span class="muted">${fmtTime(run.queuedAt)} · ${esc(TRIGGER[run.trigger] ?? run.trigger)} · итераций ${run.iterations}</span>
          <span class="runhyp">${esc(run.hypothesis || '…')}</span>
        </button>`).join('')
      : '<p class="muted">Запусков пока нет.</p>';
  }

  const list = (title, items) => (items && items.length
    ? `<div><b>${esc(title)}</b><ul class="plain">${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');

  const sub = (key, title, html) => `<details class="sub" data-key="${esc(key)}"${openAttr(key)}><summary>${esc(title)}</summary>${html}</details>`;

  function actionBlock(a) {
    const snap = (s) => (s ? `<div class="muted">${esc(s)}</div>` : '');
    return `<div class="action">
      <div><b>Действие:</b> ${esc(a.type)} → <code>${esc(a.target)}</code> · режим ${esc(a.mode)} · статус <b>${esc(a.status)}</b>
        ${a.effect !== 'NotMeasured' ? ` · эффект ${esc(a.effect)}` : ''}${a.approvedBy ? ` · одобрил ${esc(a.approvedBy)}` : ''}</div>
      <div>${esc(a.detail)}</div>
      ${snap(a.before ? 'до: ' + a.before : '')}${snap(a.after ? 'после: ' + a.after : '')}
      <ul class="checks">${(a.checks ?? []).map((c) => `<li class="${c.passed ? 'ok' : 'bad'}">${c.passed ? '✓' : '✗'} ${esc(c.name)}: ${esc(c.detail)}</li>`).join('')}</ul>
    </div>`;
  }

  function iterationCard(runId, i) {
    const key = `${runId}:${i.number}`;
    const actChip = i.action ? `<span class="chip ${i.action.status === 'Executed' ? 'ok' : i.action.status === 'Refused' ? '' : 'warn'}">${esc(i.action.type)}: ${esc(i.action.status)}</span>` : '';
    const tools = (i.toolCalls ?? []).map((c) => `<li><code>${esc(c.tool)}</code>(${esc(c.arguments)})${c.failed ? ' <span class="bad">ошибка</span>' : ''}
      <pre>${esc(c.resultPreview)}</pre></li>`).join('');
    return `<details class="it" data-key="${esc(key)}"${openAttr(key)}>
      <summary>
        <span class="num">${i.number}</span>
        <span class="hyp" title="${esc(i.hypothesis)}">${esc(i.hypothesis)}</span>
        <span class="chips">
          <span class="chip">уверенность: ${esc(i.confidence)}</span>${actChip}
          <span class="chip ${i.done ? 'ok' : ''}">${i.done ? 'решено' : 'не решено'}</span>
          <span class="chip">${esc(fmtTime(i.startedAt))}</span>
        </span>
      </summary>
      <div class="body">
        <p>${esc(i.summary)}</p>
        ${list('Свидетельства', i.evidence)}${list('Рекомендации', i.recommendations)}${list('Что проверить дальше', i.nextChecks)}${list('Факты, подтверждённые в этой итерации', i.facts)}
        <p class="muted">Проверка завершения (код, не модель): ${esc(i.completionReason)} · ${Number(i.durationSeconds).toFixed(1)} с · токены ${i.inputTokens}/${i.outputTokens} · модель ${esc(i.model)}</p>
        ${i.action ? actionBlock(i.action) : ''}
        <p class="muted">Lead: ${esc(i.lead)}</p>
        ${tools ? sub(`${key}:tools`, `Вызовы инструментов (${i.toolCalls.length})`, `<ul class="plain">${tools}</ul>`) : ''}
        ${sub(`${key}:thinking`, 'Ход рассуждения (сырой ответ модели)', `<pre>${esc(i.thinking)}</pre>`)}
        ${sub(`${key}:observed`, 'Что увидел код (R: наблюдения до вызова модели)', `<pre>${esc(i.observations)}</pre>`)}
      </div>
    </details>`;
  }

  async function renderRun() {
    const box = $('#detail');
    if (!selected) { box.innerHTML = '<p class="muted">Выберите запуск слева.</p>'; return; }
    const r = await api('GET', `/runs/${encodeURIComponent(selected)}/trace`);
    if (!r.ok) { box.innerHTML = `<p class="bad">${esc(r.data?.error ?? `запуск не найден (${r.status})`)}</p>`; return; }
    const { run, iterations } = r.data;
    const running = run.status !== 'finished';
    const note = iterations.length ? ''
      : (running ? '<p class="muted">Первая итерация ещё идёт: ход рассуждений появится, когда она закончится.</p>'
        : '<p class="muted">Ход рассуждений этого запуска не сохранён (запуск был до последнего перезапуска агента). Полный текст — в отчёте.</p>');
    box.innerHTML = `
      <div class="dhead">
        <div>
          <h2>Запуск <code>${esc(run.id)}</code></h2>
          <div class="muted">${esc(TRIGGER[run.trigger] ?? run.trigger)} · ${fmtTime(run.queuedAt)} · итераций: ${run.iterations}${running ? ' · <span class="run">идёт</span>' : ''}</div>
        </div>
        <a class="ghost" href="/runs/${encodeURIComponent(run.id)}/report" target="_blank" rel="noopener">отчёт (Markdown)</a>
      </div>
      <div class="verdict"><b>${esc(statusText(run))}</b>${run.outcomeReason ? ' — ' + esc(run.outcomeReason) : ''}</div>
      ${note}
      ${iterations.map((i) => iterationCard(run.id, i)).join('')}`;
  }

  // A click on a run only changes which run the detail pane shows.
  $('#runs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-run]');
    if (!b) return;
    selected = b.dataset.run;
    renderRuns();
    renderRun();
  });
  $('#modes').addEventListener('click', (e) => {
    const b = e.target.closest('[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
  $('#approvals').addEventListener('click', (e) => {
    const b = e.target.closest('[data-approve]');
    if (b) decide(b.dataset.approve, b.dataset.v === 'true');
  });

  async function startRun(body) {
    const r = await api('POST', '/runs', body);
    if (r.ok) { selected = r.data.runId; toast('Запуск начат'); renderRuns(); renderRun(); }
    else toast(r.data?.error ?? (r.status === 401 ? 'нужен токен агента' : `ошибка ${r.status}`), true);
  }
  $('#runNow').addEventListener('click', () => startRun({}));
  $('#incident').addEventListener('click', () => {
    const note = prompt('Что случилось? Одна фраза: она попадёт в запуск и отчёт.');
    if (note && note.trim()) startRun({ incident: true, note: note.trim() });
  });

  // Live: one refresh per 3 s, never two at once. Heavy parts only redraw what changed.
  async function tick() {
    await Promise.all([renderHealth(), renderMode(), renderApprovals(), renderRuns(), renderRun()]);
    setTimeout(tick, 3000);
  }
  tick();
})();
</script>
</body>
</html>
