<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE agent: console</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1c2230; --muted: #667085; --line: #e2e5eb;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --chip: #eef1f6; --violet: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3a;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #232835; --violet: #a78bfa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3a;
    --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #232835; --violet: #a78bfa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  main { padding: 16px; display: grid; gap: 16px; max-width: 1400px; margin: 0 auto; }
  .cols { display: grid; grid-template-columns: minmax(270px, 350px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 160px; min-width: 0; }
  input, select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; max-width: 100%; }
  label { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  label > input, label > select { color: var(--text); font-size: 14px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  button.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
  button.link { background: none; border: none; color: var(--accent); padding: 0; text-align: left; }
  button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--text); }
  a.ghost { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.run { color: var(--accent); }
  /* who started the run: one colour per trigger, the same in the list and in the session */
  .trg { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; white-space: nowrap; }
  .trg.Alert { color: var(--bad); } .trg.Incident { color: var(--warn); } .trg.Schedule { color: var(--violet); } .trg.Manual { color: var(--accent); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 340px; overflow: auto; font-size: 12.5px; margin: 6px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .run { color: var(--accent); }
  .status { cursor: pointer; }
  /* runs list */
  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 2px; }
  .filters button { padding: 2px 9px; font-size: 12px; border-color: var(--line); background: transparent; color: var(--muted); }
  .filters button[aria-pressed="true"] { color: var(--text); border-color: var(--text); box-shadow: none; }
  #runs { display: grid; gap: 6px; margin-top: 8px; max-height: 70vh; overflow: auto; }
  button.runitem { text-align: left; display: grid; gap: 3px; background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.runitem.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .runhyp { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* session */
  .dhead { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .verdict { margin: 10px 0; padding: 8px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
  .interim { border-left: 3px solid var(--accent); padding: 8px 10px; margin: 10px 0; background: var(--bg); border-radius: 0 6px 6px 0; }
  .report { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 4px; overflow-wrap: anywhere; }
  .report h2 { font-size: 17px; margin: 14px 0 6px; } .report h3 { font-size: 15px; } .report h4 { font-size: 14px; margin: 10px 0 4px; }
  .report ul { margin: 4px 0; padding-left: 20px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  /* iterations (in the details dialog) */
  .it { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; padding: 10px 12px; }
  .ithead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .num { font-weight: 700; margin-right: 4px; }
  .it p { margin: 6px 0; }
  details.sub { margin: 6px 0; }
  details.sub > summary { cursor: pointer; color: var(--accent); }
  ul.plain { margin: 4px 0; padding-left: 18px; }
  .action { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 8px 0; background: var(--bg); border-radius: 0 6px 6px 0; }
  ul.checks { list-style: none; padding-left: 0; margin: 4px 0; font-size: 13px; }
  .appr { border: 1px solid var(--warn); border-radius: 8px; padding: 10px; margin-top: 8px; }
  /* dialogs */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(920px, 94vw); max-height: 90vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog.narrow { width: min(560px, 94vw); }
  .dlghead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .dlgbody { padding: 12px 16px 16px; display: grid; gap: 10px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 0; display: grid; gap: 8px; min-width: 0; }
  legend { padding: 0 6px; color: var(--muted); font-size: 13px; }
  .prov { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
  .prov:first-of-type { border-top: none; padding-top: 0; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
           padding: 8px 14px; border-radius: 8px; max-width: 90vw; z-index: 50; }
  .toast.bad { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <h1><span id="health" class="dot" title="agent readiness"></span> SRE agent</h1>
  <div id="status" class="row muted status" title="open settings"></div>
  <div class="row">
    <button id="openRun">Start agent run</button>
    <button id="openSettings" class="ghost">Settings</button>
  </div>
</header>

<main>
  <section id="approvals" class="card hidden" aria-live="polite"></section>
  <div class="cols">
    <aside class="card">
      <h2>Runs</h2>
      <div id="filters" class="filters"></div>
      <div id="runs"><p class="muted">Loading…</p></div>
    </aside>
    <section id="detail" class="card"><p class="muted">Select a run on the left.</p></section>
  </div>
</main>

<dialog id="dlgTrace"><div class="dlghead"><h2 id="traceTitle">Work log</h2><button class="ghost" data-close>Close</button></div><div id="traceBody" class="dlgbody"></div></dialog>
<dialog id="dlgRun" class="narrow"><div class="dlghead"><h2>Start agent run</h2><button class="ghost" data-close>Close</button></div><div id="runBody" class="dlgbody"></div></dialog>
<dialog id="dlgSettings" class="narrow"><div class="dlghead"><h2>Settings</h2><button class="ghost" data-close>Close</button></div><div id="settingsBody" class="dlgbody"></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>

<script>
(() => {
  const $ = (s, root = document) => root.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtTime = (t) => (t ? new Date(t).toLocaleTimeString('en-GB') : '—');
  const fmtDate = (t) => (t ? new Date(t).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—');
  const fmtDur = (a, b) => { if (!a || !b) return '—'; const s = Math.round((new Date(b) - new Date(a)) / 1000); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`; };
  const TRIGGER = { Alert: 'alert', Schedule: 'schedule', Manual: 'manual', Incident: 'incident' };
  const OUTCOME = { Resolved: 'resolved', LimitsExhausted: 'iteration limit', Escalated: 'escalated', Failed: 'failed', Cancelled: 'cancelled' };
  const MODES = ['DryRun', 'Approve', 'Auto'];
  const MODE_TEXT = { DryRun: 'describe actions only', Approve: 'actions with your approval', Auto: 'actions automatically' };
  const AUTO_WARNING = 'Auto mode: the agent will be able to run allowed actions (restarting a Deployment in sandbox) without your approval. Continue?';

  // What the page knows. Everything shown is drawn from here; the 3-second tick only refreshes it.
  const state = { selected: null, filter: 'all', runs: [], actions: null, llm: null, trace: null, traceKey: '', reports: {} };
  const openKeys = new Set();   // expanded sub-blocks in the details dialog (kept across refreshes)
  let toastTimer = null;

  // Per-viewer conveniences only: the token stays in this tab, the name remembers itself.
  const load = (store, key) => { try { return store.getItem(key) ?? ''; } catch { return ''; } };
  const save = (store, key, v) => { try { store.setItem(key, v); } catch { /* private window: fine */ } };
  const token = () => load(sessionStorage, 'agent-token');
  const who = () => load(localStorage, 'agent-by');

  function toast(msg, bad = false) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), 5000);
  }

  async function api(method, path, body) {
    const headers = {};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (token()) headers['X-Agent-Token'] = token();
    try {
      const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      return { ok: res.ok, status: res.status, data };
    } catch (e) {
      return { ok: false, status: 0, data: { error: 'agent unavailable: ' + e.message } };
    }
  }
  const errorOf = (r) => r.data?.error ?? (r.status === 401 ? 'agent token required (Settings)' : `error ${r.status}`);

  const statusText = (r) => (r.status === 'finished' ? (OUTCOME[r.outcome] ?? r.outcome ?? 'finished') : r.status === 'running' ? 'running' : 'queued');
  const statusClass = (r) => (r.status !== 'finished' ? 'chip run'
    : r.outcome === 'Resolved' ? 'chip ok' : (r.outcome === 'Escalated' || r.outcome === 'Failed') ? 'chip bad' : 'chip warn');
  const trigger = (r) => `<span class="trg ${esc(r.trigger)}">${esc(TRIGGER[r.trigger] ?? r.trigger)}</span>`;
  const modelText = (r) => [r.provider, r.model].filter(Boolean).join(' / ') || '—';

  document.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
    if (d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key);
  }, true);
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-close]'); if (b) b.closest('dialog').close(); });

  // ---------- header ----------
  function renderStatus() {
    const a = state.actions, l = state.llm;
    const mode = a?.mode ? `Default mode: <b>${esc(a.mode)}</b>` : 'Actions disabled';
    const llm = l ? `Model: <b>${esc(l.default.provider)} / ${esc(l.default.model)}</b>` : '';
    $('#status').innerHTML = `<span>${mode}</span><span>${llm}</span>`;
  }

  // ---------- approvals ----------
  function renderApprovals(list) {
    const box = $('#approvals');
    box.classList.toggle('hidden', list.length === 0);
    box.innerHTML = list.length ? `<h2>Waiting for your decision (${list.length})</h2>` + list.map((a) => `
      <div class="appr">
        <div><b>${esc(a.proposal.type)}</b> → <code>${esc(a.proposal.target)}</code> · run <code>${esc(a.runId)}</code>, iteration ${a.iteration} · until ${fmtTime(a.expiresAt)}</div>
        <div class="muted">${esc(a.proposal.reason)}</div>
        <div class="row" style="margin-top:6px">
          <button data-approve="${esc(a.id)}" data-v="true">Approve</button>
          <button class="danger" data-approve="${esc(a.id)}" data-v="false">Reject</button>
        </div>
      </div>`).join('') : '';
  }
  $('#approvals').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-approve]');
    if (!b) return;
    if (!who()) { toast('Enter your name in Settings: it goes to the audit log', true); openSettings(); return; }
    const approve = b.dataset.v === 'true';
    const r = await api('POST', `/approvals/${encodeURIComponent(b.dataset.approve)}`, { approve, by: who() });
    toast(r.ok ? (approve ? 'Approved' : 'Rejected') : errorOf(r), !r.ok);
    tick(true);
  });

  // ---------- run list ----------
  function renderFilters() {
    const counts = { all: state.runs.length };
    for (const r of state.runs) counts[r.trigger] = (counts[r.trigger] ?? 0) + 1;
    const items = [['all', 'all'], ['Alert', 'alert'], ['Incident', 'incident'], ['Schedule', 'schedule'], ['Manual', 'manual']];
    $('#filters').innerHTML = items.map(([k, t]) => `<button data-filter="${k}" aria-pressed="${state.filter === k}">${t} ${counts[k] ?? 0}</button>`).join('');
  }
  function renderRuns() {
    renderFilters();
    const runs = state.runs.filter((r) => state.filter === 'all' || r.trigger === state.filter);
    $('#runs').innerHTML = runs.length ? runs.map((run) => `
      <button class="runitem ${run.id === state.selected ? 'sel' : ''}" data-run="${esc(run.id)}">
        <span class="row">${trigger(run)}<span class="${statusClass(run)}">${esc(statusText(run))}</span><span class="muted">${fmtDate(run.queuedAt)}</span></span>
        <span class="runhyp">${esc(run.hypothesis || run.triggerDetail || '…')}</span>
        <span class="muted">${esc(modelText(run))} · iterations ${run.iterations}${run.mode ? ' · ' + esc(run.mode) : ''}</span>
      </button>`).join('') : '<p class="muted">No runs.</p>';
  }
  $('#filters').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (b) { state.filter = b.dataset.filter; renderRuns(); } });
  $('#runs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-run]');
    if (!b) return;
    state.selected = b.dataset.run; state.trace = null; state.traceKey = '';
    renderRuns(); tick(true);
  });

  // ---------- a tiny, safe Markdown renderer for the agent's reports ----------
  // Everything is escaped first; only the few constructs the report writer produces become HTML.
  function inline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])_([^_]+)_(?=$|[\s).,;:])/g, '$1<i>$2</i>');
  }
  function markdown(md) {
    const lines = md.replace(/\r/g, '').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^(`{3,})/);
      if (fence) {
        const body = [];
        i++;
        while (i < lines.length && !lines[i].startsWith(fence[1])) body.push(lines[i++]);
        i++;
        out.push(`<pre>${esc(body.join('\n'))}</pre>`);
      } else if (/^#{1,4} /.test(line)) {
        const level = line.match(/^#+/)[0].length;
        out.push(`<h${level + 1}>${inline(line.replace(/^#+ /, ''))}</h${level + 1}>`);
        i++;
      } else if (line.startsWith('|')) {
        const rows = [];
        while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]);
        const cells = (r) => r.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
        const body = rows.filter((r) => !/^\|[\s|:-]+\|?$/.test(r));
        out.push('<div class="tablewrap"><table>' + body.map((r, n) => '<tr>' + cells(r).map((c) => (n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`)).join('') + '</tr>').join('') + '</table></div>');
      } else if (line.startsWith('- ')) {
        const items = [];
        while (i < lines.length && lines[i].startsWith('- ')) items.push(`<li>${inline(lines[i++].slice(2))}</li>`);
        out.push(`<ul>${items.join('')}</ul>`);
      } else if (line.trim() === '') {
        i++;
      } else {
        const para = [];
        while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,4} |- |\||`{3,})/.test(lines[i])) para.push(inline(lines[i++]));
        out.push(`<p>${para.join('<br>')}</p>`);
      }
    }
    return out.join('');
  }

  // ---------- session ----------
  async function loadSession(force) {
    const id = state.selected;
    if (!id) return;
    const listed = state.runs.find((r) => r.id === id);
    const key = listed ? `${id}:${listed.status}:${listed.iterations}` : '';
    // A finished run does not change: load it once. A running one is reloaded every tick (new iterations).
    if (!force && state.trace && state.traceKey === key && listed?.status === 'finished') return;
    const r = await api('GET', `/runs/${encodeURIComponent(id)}/trace`);
    if (id !== state.selected) return;
    if (!r.ok) { $('#detail').innerHTML = `<p class="bad">${esc(r.data?.error ?? `run not found (${r.status})`)}</p>`; return; }
    state.trace = r.data; state.traceKey = key;
    if (r.data.run.status === 'finished' && r.data.run.reportPath && state.reports[id] === undefined) {
      try {
        const res = await fetch(`/runs/${encodeURIComponent(id)}/report`);
        state.reports[id] = res.ok ? await res.text() : null;
      } catch { state.reports[id] = null; }
    }
    if (id !== state.selected) return;
    renderSession();
    if ($('#dlgTrace').open) renderTrace();
  }

  function renderSession() {
    const { run, iterations } = state.trace;
    const running = run.status !== 'finished';
    const last = iterations[iterations.length - 1];
    const interim = running
      ? `<div class="interim"><b>The agent is working.</b> ${last
          ? `Intermediate result after iteration ${last.number}: ${esc(last.hypothesis)}<div class="muted">${esc(last.summary)}</div><div class="muted">Completion check: ${esc(last.completionReason)}</div>`
          : 'The first iteration is in progress: the result appears when it finishes.'}</div>`
      : '';
    const report = state.reports[run.id];
    const reportHtml = running ? ''
      : report ? `<div class="report">${markdown(report)}</div>`
      : `<p class="muted">${run.reportPath ? 'The report could not be loaded.' : 'This run has no report.'}</p>`;
    $('#detail').innerHTML = `
      <div class="dhead">
        <div>
          <h2>${trigger(run)} ${esc(run.triggerDetail || '')}</h2>
          <div class="meta">
            <span class="chip">started ${fmtDate(run.queuedAt)}</span>
            <span class="chip">duration ${running ? '…' : fmtDur(run.queuedAt, run.finishedAt)}</span>
            <span class="chip">model ${esc(modelText(run))}</span>
            <span class="chip">mode ${esc(run.mode ?? 'default')}</span>
            <span class="chip">iterations ${running ? iterations.length : run.iterations}</span>
          </div>
        </div>
        <div class="row">
          <button id="openTrace" class="ghost">Details: work log (${iterations.length})</button>
          ${run.reportPath ? `<a class="ghost" href="/runs/${encodeURIComponent(run.id)}/report" target="_blank" rel="noopener">Markdown</a>` : ''}
        </div>
      </div>
      <div class="verdict"><span class="${statusClass(run)}">${esc(statusText(run))}</span> ${run.outcomeReason ? esc(run.outcomeReason) : ''}</div>
      <details class="sub" data-key="goal:${esc(run.id)}"${openKeys.has('goal:' + run.id) ? ' open' : ''}><summary>Agent task</summary><p class="muted">${esc(run.goal ?? '—')}</p><p class="muted">id: <code>${esc(run.id)}</code></p></details>
      ${interim}${reportHtml}`;
  }
  $('#detail').addEventListener('click', (e) => { if (e.target.closest('#openTrace')) { renderTrace(); $('#dlgTrace').showModal(); } });

  // ---------- details dialog: every iteration with its intermediate result ----------
  const list = (title, items) => (items && items.length
    ? `<div><b>${esc(title)}</b><ul class="plain">${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
  const sub = (key, title, html) => `<details class="sub" data-key="${esc(key)}"${openKeys.has(key) ? ' open' : ''}><summary>${esc(title)}</summary>${html}</details>`;

  function actionBlock(a) {
    const snap = (s) => (s ? `<div class="muted">${esc(s)}</div>` : '');
    return `<div class="action">
      <div><b>Action:</b> ${esc(a.type)} → <code>${esc(a.target)}</code> · mode ${esc(a.mode)} · status <b>${esc(a.status)}</b>
        ${a.effect !== 'NotMeasured' ? ` · effect ${esc(a.effect)}` : ''}${a.approvedBy ? ` · approved by ${esc(a.approvedBy)}` : ''}</div>
      <div class="muted">Model's reason: ${esc(a.reason)}</div>
      <div>${esc(a.detail)}</div>
      ${snap(a.before ? 'before: ' + a.before : '')}${snap(a.after ? 'after: ' + a.after : '')}
      <ul class="checks">${(a.checks ?? []).map((c) => `<li class="${c.passed ? 'ok' : 'bad'}">${c.passed ? '✓' : '✗'} ${esc(c.name)}: ${esc(c.detail)}</li>`).join('')}</ul>
    </div>`;
  }

  function iterationCard(runId, i) {
    const key = `${runId}:${i.number}`;
    const tools = (i.toolCalls ?? []).map((c) => `<li><code>${esc(c.tool)}</code>(${esc(c.arguments)})${c.failed ? ' <span class="bad">error</span>' : ''}
      <pre>${esc(c.resultPreview)}</pre></li>`).join('');
    return `<div class="it">
      <div class="ithead">
        <span class="num">Iteration ${i.number}</span>
        <span class="chip">${esc(fmtTime(i.startedAt))} · ${Number(i.durationSeconds).toFixed(0)} s</span>
        <span class="chip">confidence: ${esc(i.confidence)}</span>
        ${i.action ? `<span class="chip ${i.action.status === 'Executed' ? 'ok' : 'warn'}">${esc(i.action.type)}: ${esc(i.action.status)}</span>` : ''}
        <span class="chip ${i.done ? 'ok' : ''}">${i.done ? 'task solved' : 'not solved'}</span>
      </div>
      <p><b>${esc(i.hypothesis)}</b></p>
      <p>${esc(i.summary)}</p>
      ${i.action ? actionBlock(i.action) : ''}
      <p class="muted">Completion check (code, not the model): ${esc(i.completionReason)}</p>
      ${sub(`${key}:result`, 'Evidence, facts, recommendations', `${list('Evidence', i.evidence)}${list('Facts confirmed in this iteration', i.facts)}${list('Recommendations', i.recommendations)}${list('What to check next', i.nextChecks)}
        <p class="muted">Lead: ${esc(i.lead)} · tokens ${i.inputTokens}/${i.outputTokens} · model ${esc(i.model)}</p>`)}
      ${tools ? sub(`${key}:tools`, `Tool calls (${i.toolCalls.length})`, `<ul class="plain">${tools}</ul>`) : ''}
      ${sub(`${key}:thinking`, 'Reasoning (raw model output)', `<pre>${esc(i.thinking)}</pre>`)}
      ${sub(`${key}:observed`, 'What the code saw before calling the model (R)', `<pre>${esc(i.observations)}</pre>`)}
    </div>`;
  }

  function renderTrace() {
    if (!state.trace) return;
    const { run, iterations } = state.trace;
    const running = run.status !== 'finished';
    $('#traceTitle').innerHTML = `Work log · ${trigger(run)} ${fmtDate(run.queuedAt)}`;
    $('#traceBody').innerHTML = (iterations.length ? iterations.map((i) => iterationCard(run.id, i)).join('')
      : `<p class="muted">${running ? 'The first iteration is still running.' : 'The iterations of this run were not saved (it ran before history was enabled). See the report.'}</p>`)
      + (running ? `<p class="run">Iteration ${iterations.length + 1} in progress…</p>` : '');
  }

  // ---------- model picker (shared by the run dialog and the settings) ----------
  const providerOptions = (selected) => (state.llm?.providers ?? []).map((p) =>
    `<option value="${esc(p.name)}"${p.name === selected ? ' selected' : ''}>${esc(p.name)}${p.requiresKey && !p.keySet ? ' (no key)' : ''}</option>`).join('');
  function fillModels(root, provider, value) {
    const p = (state.llm?.providers ?? []).find((x) => x.name === provider);
    $('[data-models]', root).innerHTML = (p?.models ?? []).map((m) => `<option value="${esc(m)}"></option>`).join('');
    const input = $('[data-model]', root);
    input.value = value ?? (p && provider === state.llm.default.provider ? state.llm.default.model : (p?.models[0] ?? ''));
    input.placeholder = p?.anyModel ? 'model id of the provider' : 'model from the list';
  }
  async function refreshModels(root) {
    const provider = $('[data-provider]', root).value;
    const r = await api('GET', `/llm/providers/${encodeURIComponent(provider)}/models`);
    if (r.ok && r.data.models?.length) $('[data-models]', root).innerHTML = r.data.models.map((m) => `<option value="${esc(m)}"></option>`).join('');
    toast(r.ok && !r.data.error ? `Models from provider: ${r.data.models.length}` : (r.data?.error ?? errorOf(r)), !(r.ok && !r.data.error));
  }
  const modelPicker = (id) => `
    <div class="row">
      <label class="grow">Provider<select data-provider>${providerOptions(state.llm?.default.provider)}</select></label>
      <label class="grow">Model<input data-model list="${id}" autocomplete="off"><datalist id="${id}" data-models></datalist></label>
      <button type="button" class="ghost" data-refresh title="ask the provider for its model list" style="align-self:end">List</button>
    </div>`;
  function wirePicker(root) {
    fillModels(root, $('[data-provider]', root).value);
    $('[data-provider]', root).addEventListener('change', (e) => fillModels(root, e.target.value));
    $('[data-refresh]', root).addEventListener('click', () => refreshModels(root));
  }

  // ---------- run dialog ----------
  function openRun() {
    const globalMode = state.actions?.mode;
    $('#runBody').innerHTML = `
      <label>What to run
        <select id="runKind">
          <option value="check">Health check (one iteration)</option>
          <option value="incident">Incident (keeps working until the system is back to normal)</option>
        </select>
      </label>
      <label>Comment: what happened or why this run (goes into the report)<input id="runNote" maxlength="300" placeholder="for example: users report errors"></label>
      <fieldset><legend>Model</legend>${modelPicker('runModels')}</fieldset>
      <fieldset><legend>Action mode for this run</legend>
        ${globalMode ? `<div class="row" id="runModes">
            <button type="button" class="ghost" data-runmode="" aria-pressed="true">Default (${esc(globalMode)})</button>
            ${MODES.map((m) => `<button type="button" class="ghost" data-runmode="${m}" aria-pressed="false" title="${esc(MODE_TEXT[m])}">${m}</button>`).join('')}
          </div>
          <div class="muted" id="runModeHint">Same as for alert and schedule runs.</div>`
        : '<div class="muted">No actions configured: the agent only observes.</div>'}
      </fieldset>
      <div class="row" style="justify-content:flex-end"><button id="runStart">Start</button></div>`;
    const body = $('#runBody');
    wirePicker(body);
    let mode = '';
    $('#runModes')?.addEventListener('click', (e) => {
      const b = e.target.closest('[data-runmode]');
      if (!b) return;
      mode = b.dataset.runmode;
      for (const x of body.querySelectorAll('[data-runmode]')) x.setAttribute('aria-pressed', String(x === b));
      $('#runModeHint').textContent = mode ? `${MODE_TEXT[mode]}. Each action's own mode still applies (delete_pod still needs approval).` : 'Same as for alert and schedule runs.';
    });
    $('#runStart').addEventListener('click', async () => {
      if (mode === 'Auto' && !confirm(AUTO_WARNING)) return;
      const note = $('#runNote').value.trim();
      const request = { provider: $('[data-provider]', body).value, model: $('[data-model]', body).value.trim() || null, note: note || null };
      if ($('#runKind').value === 'incident') request.incident = true;
      if (mode) request.mode = mode;
      const r = await api('POST', '/runs', request);
      if (!r.ok) { toast(errorOf(r), true); return; }
      $('#dlgRun').close();
      state.selected = r.data.runId; state.trace = null; state.filter = 'all';
      toast('Run started');
      tick(true);
    });
    $('#dlgRun').showModal();
  }
  $('#openRun').addEventListener('click', openRun);

  // ---------- settings dialog ----------
  function renderSettings() {
    const a = state.actions, l = state.llm;
    const allowed = Object.entries(a?.allowed ?? {}).map(([type, eff]) => `<span class="chip">${esc(type)}: <b>${esc(eff)}</b></span>`).join('');
    const keyText = (p) => (p.keySource === 'runtime' ? 'key set here (in agent memory, until restart)' : p.keySource === 'config' ? 'key from Secret' : p.requiresKey ? 'key not set' : 'no key needed');
    $('#settingsBody').innerHTML = `
      <fieldset><legend>You</legend>
        <label>Name (goes into the audit of approvals and mode changes)<input id="setBy" value="${esc(who())}"></label>
        <label>Agent token (if Agent__ApiToken is enabled; stored only in this tab)<input id="setToken" type="password" value="${esc(token())}" autocomplete="off"></label>
      </fieldset>
      <fieldset><legend>Default action mode (alerts, schedule)</legend>
        ${a?.mode ? `<div class="row" id="setModes">${MODES.map((m) => `<button type="button" data-mode="${m}" aria-pressed="${a.mode === m}" class="${a.mode === m ? '' : 'ghost'}" title="${esc(MODE_TEXT[m])}">${m}</button>`).join('')}</div>
          <div class="row">${allowed}</div>
          <div class="muted">The effective action mode is the stricter of this ceiling and the action's own mode. After an agent restart the value from values comes back.</div>`
        : `<div class="muted">${esc(a?.reason ?? 'Actions are not configured: the agent only observes.')}</div>`}
      </fieldset>
      <fieldset id="setDefault"><legend>Default model (alerts, schedule)</legend>
        ${modelPicker('setModels')}
        <div class="row" style="justify-content:flex-end"><button type="button" id="saveDefault">Make default model</button></div>
      </fieldset>
      <fieldset><legend>Providers and keys</legend>
        ${(l?.providers ?? []).map((p) => `
          <div class="prov">
            <div><b>${esc(p.name)}</b> <span class="muted">${esc(p.baseUrl)}</span></div>
            <div class="muted">${esc(keyText(p))}${p.anyModel ? ' · any model of the provider' : ' · models: ' + esc(p.models.join(', '))}</div>
            <div class="row">
              <input class="grow" type="password" data-key="${esc(p.name)}" placeholder="API key" autocomplete="off">
              <button type="button" data-savekey="${esc(p.name)}">Save key</button>
              ${p.keySource === 'runtime' ? `<button type="button" class="danger" data-dropkey="${esc(p.name)}">Forget</button>` : ''}
            </div>
          </div>`).join('')}
        <div class="muted">The key goes to the agent and is kept only in its memory: it is not written to disk and not returned by the API. New providers (address, model list) are added in the agent's values as <code>Llm__Providers__&lt;name&gt;__BaseUrl</code>, together with an outgoing-traffic rule in NetworkPolicy; see docs/17.</div>
      </fieldset>`;
    wirePicker($('#setDefault'));
  }
  async function openSettings() { await refreshSettings(); $('#dlgSettings').showModal(); }
  async function refreshSettings() { await loadShared(); renderSettings(); renderStatus(); }
  $('#openSettings').addEventListener('click', openSettings);
  $('#status').addEventListener('click', openSettings);
  $('#settingsBody').addEventListener('input', (e) => {
    if (e.target.id === 'setBy') save(localStorage, 'agent-by', e.target.value.trim());
    if (e.target.id === 'setToken') save(sessionStorage, 'agent-token', e.target.value.trim());
  });
  $('#settingsBody').addEventListener('click', async (e) => {
    const body = $('#settingsBody');
    const modeBtn = e.target.closest('[data-mode]');
    if (modeBtn) {
      const mode = modeBtn.dataset.mode;
      if (mode === 'Auto' && !confirm(AUTO_WARNING)) return;
      const r = await api('PUT', '/actions/mode', { mode, by: who() || 'console' });
      toast(r.ok ? `Default mode: ${r.data.previous} → ${r.data.mode}` : errorOf(r), !r.ok);
      return refreshSettings();
    }
    if (e.target.closest('#saveDefault')) {
      const root = $('#setDefault');
      const r = await api('PUT', '/llm/default', { provider: $('[data-provider]', root).value, model: $('[data-model]', root).value.trim() || null });
      toast(r.ok ? `Default model: ${r.data.provider} / ${r.data.model}` : errorOf(r), !r.ok);
      return refreshSettings();
    }
    const saveKey = e.target.closest('[data-savekey]');
    const dropKey = e.target.closest('[data-dropkey]');
    if (saveKey || dropKey) {
      const name = (saveKey ?? dropKey).dataset.savekey ?? dropKey.dataset.dropkey;
      const value = saveKey ? $(`[data-key="${CSS.escape(name)}"]`, body).value.trim() : '';
      if (saveKey && !value) { toast('Enter a key', true); return; }
      const r = await api('PUT', `/llm/providers/${encodeURIComponent(name)}/key`, { apiKey: value });
      toast(r.ok ? (saveKey ? `Key for ${name} saved in agent memory` : `Key for ${name} forgotten`) : errorOf(r), !r.ok);
      return refreshSettings();
    }
  });

  // ---------- refresh loop ----------
  async function loadShared() {
    const [a, l] = await Promise.all([api('GET', '/actions'), api('GET', '/llm')]);
    if (a.ok) state.actions = a.data;
    if (l.ok) state.llm = l.data;
  }
  let ticking = false;
  async function tick(force = false) {
    if (ticking) return;
    ticking = true;
    try {
      const [health, approvals, runs] = await Promise.all([api('GET', '/health/ready'), api('GET', '/approvals'), api('GET', '/runs'), loadShared()]);
      $('#health').className = 'dot ' + (health.ok ? 'ok' : 'bad');
      $('#health').title = health.ok ? 'agent ready' : 'agent not responding';
      renderStatus();
      renderApprovals(Array.isArray(approvals.data) ? approvals.data : []);
      if (runs.ok && Array.isArray(runs.data)) {
        state.runs = runs.data;
        if (!state.selected && runs.data.length) state.selected = runs.data[0].id;
        renderRuns();
      } else if (!runs.ok) {
        $('#runs').innerHTML = `<p class="bad">${esc(errorOf(runs))}</p>`;
      }
      await loadSession(force);
    } finally {
      ticking = false;
    }
  }
  tick(true);
  setInterval(() => tick(false), 3000);
})();
</script>
</body>
</html>
