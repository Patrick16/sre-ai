# Loki in "monolithic" mode: one pod, filesystem storage on a PVC. Enough for a sandbox;
# production runs the scalable modes with object storage (S3/GCS/Azure Blob).
# Chart: grafana/loki 7.5.0. Installed by scripts/deploy-infra.ps1.
deploymentMode: SingleBinary

loki:
  auth_enabled: false   # single tenant; multi-tenant Loki requires an X-Scope-OrgID header on every request
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# The scalable components and the extras a sandbox doesn't need.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
