# Grafana Alloy as the log collector (Promtail reached end of life in March 2026).
# A DaemonSet: one collector per node, each tailing only the log files of pods on its own node.
# Chart: grafana/alloy 1.15.0. Installed by scripts/deploy-infra.ps1.
controller:
  type: daemonset
  # A DaemonSet skips tainted nodes unless it tolerates the taint. The control-plane node runs Traefik,
  # so without this its logs would silently be missing.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

alloy:
  mounts:
    varlog: true   # hostPath /var/log: containerd writes every container's stdout/stderr to /var/log/pods/...
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    content: |
      // 1. Which pods run on this node (from the Kubernetes API).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // 2. Labels for every log stream, and the log file path of each container.
      //    Keep labels low-cardinality: namespace/app/pod/container yes, request ids never.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // 3. Parse: strip the CRI line prefix; for our .NET services (JSON console logs) lift LogLevel into a label.
      loki.process "pods" {
        stage.cri {}

        stage.match {
          selector = "{namespace=~\"sandbox|sre-agent\", container!=\"postgres\"}"
          stage.json {
            expressions = { level = "LogLevel" }
          }
          stage.labels {
            values = { level = "" }
          }
        }

        stage.label_drop {
          values = ["filename"]
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
