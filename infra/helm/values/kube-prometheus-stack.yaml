# Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics + the Prometheus Operator.
# Chart: prometheus-community/kube-prometheus-stack 93.0.0. Installed by scripts/deploy-infra.ps1.

# kind's control-plane components listen on 127.0.0.1 inside their node, so Prometheus can't scrape them
# (managed clouds like EKS/GKE don't let you scrape them at all). Without this they'd show up as permanent
# "target down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    # kind nodes are containers sharing the host's (WSL2) clock: the kernel's NTP status flaps to "not
    # synchronised" even though time is fine. On real nodes keep these - clock skew breaks TLS and leases.
    NodeClockNotSynchronising: true
    NodeClockSkewDetected: true

prometheus-node-exporter:
  # Docker Desktop's node filesystem is not a shared mount; mounting / with HostToContainer propagation fails.
  hostRootFsMount:
    enabled: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: sandbox-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts: [prometheus.localhost]
    paths: [/]
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.localhost]
  prometheusSpec:
    # Default: only ServiceMonitors/PodMonitors/rules labelled with this release are picked up, and
    # anything else is silently ignored. We want every namespace's monitors and rules.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 3d
    retentionSize: 4GB
    # Time series on a PVC (Phase 4): metrics survive a Prometheus restart.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: sandbox-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts: [alertmanager.localhost]
    paths: [/]
    tls:
      - secretName: alertmanager-tls
        hosts: [alertmanager.localhost]
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: sre-agent
      routes:
        # Watchdog always fires: it proves the alerting pipeline itself is alive. Nobody needs a notification.
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
        - receiver: "null"
          matchers: [alertname = "InfoInhibitor"]
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
    receivers:
      - name: "null"
      # Phase 5: a stub in SreAgent.Host that logs and keeps alerts. Phase 7+: the real agent trigger.
      - name: sre-agent
        webhook_configs:
          - url: http://sre-agent.sre-agent.svc.cluster.local/webhooks/alertmanager
            send_resolved: true

grafana:
  admin:
    existingSecret: grafana-admin   # generated by scripts/deploy-infra.ps1
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: sandbox-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts: [grafana.localhost]
    path: /
    tls:
      - secretName: grafana-tls
        hosts: [grafana.localhost]
  grafana.ini:
    server:
      root_url: https://grafana.localhost
  # Dashboards are code: ConfigMaps labelled grafana_dashboard=1 in any namespace are loaded by a sidecar.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
