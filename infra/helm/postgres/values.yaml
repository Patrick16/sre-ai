image:
  repository: postgres
  tag: "18.6-trixie"   # official image; Bitnami images moved to an unmaintained legacy repo in 2025
  pullPolicy: IfNotPresent

# 1 = running, 0 = stopped (PVC kept). Change it with helm, never `kubectl scale` (that creates SSA drift).
replicas: 1

database: orders
username: orders

# postgres_exporter sidecar: pg_up, connections, database size, locks... scraped through a ServiceMonitor.
metrics:
  enabled: true
  image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
  port: 9187

# Secret with the password (key `password`); created by scripts/deploy-apps.ps1, never stored in git.
passwordSecret:
  name: postgres-credentials
  key: password

storage:
  size: 1Gi
  storageClassName: standard   # kind's local-path provisioner: a directory on ONE node's disk

# What happens to the PVC when the StatefulSet is deleted / scaled down. Retain = data survives `helm uninstall`.
pvcRetention:
  whenDeleted: Retain
  whenScaled: Retain

# Who may connect to port 5432 (the namespace denies everything by default). Metrics: monitoring namespace.
networkPolicy:
  enabled: true
  allowFromApps: [orders-api]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
