apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-script
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: sandbox
data:
  load.js: |
    import http from 'k6/http';

    export const options = {
      // TLS goes to Traefik's cluster address; the certificate is for sandbox.localhost, so skip verification.
      insecureSkipTLSVerify: true,
      scenarios: {
        steady: {
          executor: 'constant-arrival-rate',
          rate: Number(__ENV.RATE),
          timeUnit: '1s',
          duration: '24h',
          preAllocatedVUs: 10,
          maxVUs: 100,
        },
      },
    };

    const params = { headers: { Host: __ENV.HOST }, timeout: '5s' };

    export default function () {
      if (Math.random() < Number(__ENV.POST_SHARE)) {
        http.post(`${__ENV.TARGET}/order?item=load-${Date.now()}`, null, params);
      } else {
        http.get(`${__ENV.TARGET}/`, params);
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/part-of: sandbox
spec:
  replicas: {{ if .Values.enabled }}1{{ else }}0{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/part-of: sandbox
      annotations:
        checksum/script: {{ .Values | toJson | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345   # k6 image user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          # -q: no progress bar spam in the logs. After 24h k6 exits and the Deployment restarts it.
          # (k6 v2 replaced --no-summary with --summary-mode=disabled.)
          args: ["run", "-q", "--summary-mode=disabled", "/scripts/load.js"]
          env:
            - name: RATE
              value: {{ .Values.ratePerSecond | quote }}
            - name: POST_SHARE
              value: {{ .Values.postShare | quote }}
            - name: TARGET
              value: {{ .Values.target | quote }}
            - name: HOST
              value: {{ .Values.host | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-script
        - name: tmp
          emptyDir: {}
