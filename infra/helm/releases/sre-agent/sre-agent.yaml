# helm upgrade --install sre-agent infra/helm/sandbox-service -n sre-agent -f infra/helm/releases/sre-agent/sre-agent.yaml
# Phase 7: the agent (Ralph loop + RALF iterations, Microsoft Agent Framework, local LLM in LM Studio).
# Phase 8: may run two allowlisted actions through the guardrails (docs/06, docs/17).
replicas: 1

image:
  repository: sre-agent/host
  tag: "0.5.2"   # 0.2.x: observe-only; 0.3.x: facts + synthesis; 0.4.x: actions + guardrails; 0.5.0: incidents, steady state incl. pods; 0.5.1: latency in Retrieve; 0.5.2: age of last termination

# The agent talks to the Kubernetes API, so it needs a token. Rights = read in sandbox + exactly what the two actions
# need. RBAC can't say "only this annotation" - patch on deployments would also allow scaling - so the admission
# policy infra/manifests/platform/sre-agent-admission-policy.yaml narrows it down to the restart annotation.
serviceAccount:
  automountToken: true
rbac:
  namespaceRules:
    sre-agent:
      # The kill switch: its mere existence stops all actions. Only this one name, only get.
      - apiGroups: [""]
        resources: [configmaps]
        resourceNames: [sre-agent-kill-switch]
        verbs: [get]
    sandbox:
      - apiGroups: [apps]
        resources: [deployments]
        verbs: [patch]                  # restart_deployment
      - apiGroups: [""]
        resources: [pods]
        verbs: [delete]                 # delete_pod
      - apiGroups: [""]
        resources: [pods, events, services, endpoints, persistentvolumeclaims]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [deployments, statefulsets, replicasets]
        verbs: [get, list, watch]
      - apiGroups: [events.k8s.io]
        resources: [events]
        verbs: [get, list, watch]

# Reports, audit log and RunState survive restarts.
persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

# Agent__* / Llm__* / Tools__* override appsettings.json ("__" = nesting).
configEnv:
  Agent__Namespace: "sandbox"
  Agent__ScheduleMinutes: "0"         # e.g. "60" for an hourly health check (each run costs minutes of GPU)
  Agent__Language: "Russian"
  # An 8-minute outage + ~5 minutes for the 5m SLI window to cool down doesn't fit into 6 iterations of
  # ~1.5 min + 60 s backoff: the first end-to-end test ended LimitsExhausted one iteration short.
  Agent__Limits__MaxIterations: "10"
  Llm__BaseUrl: "http://host.docker.internal:1234/v1"   # LM Studio on the Windows host
  Llm__Model: "qwen/qwen3.5-9b"
  Llm__AllowedModels__0: "qwen/qwen3.5-9b"
  Llm__AllowedModels__1: "qwythos-9b-claude-mythos-5-1m"
  Llm__AllowedModels__2: "gemma4-26b-a4b-uncensored-hauhaucs-balanced"
  Tools__Namespaces__0: "sandbox"
  # Phase 8. Global ceiling DryRun: nothing changes until a human raises it (e.g. --set configEnv.Actions__Mode=Approve).
  # Effective mode = the stricter of the ceiling and the action's own mode.
  Actions__Mode: "DryRun"
  Actions__Allowed__restart_deployment: "Auto"
  Actions__Allowed__delete_pod: "Approve"
  Actions__MaxPerRun: "2"
  Actions__MaxPerWindow: "3"           # across all runs, per 30 min
  Actions__CooldownMinutes: "10"        # same action on the same target
  Actions__ApprovalTimeoutMinutes: "5"
  Actions__VerifyDelaySeconds: "90"

networkPolicy:
  allowFromNamespaces: [monitoring]                 # Alertmanager's webhook
  allowToNamespaces:
    - { namespace: monitoring, port: 9090 }         # Prometheus
    - { namespace: monitoring, port: 3100 }         # Loki
    - { namespace: monitoring, port: 9093 }         # Alertmanager API
  allowToCidrs:
    - { cidr: 172.18.0.0/16, port: 6443 }           # kube-apiserver (kind's node network; Service 10.96.0.1:443 after DNAT)
    - { cidr: 192.168.65.254/32, port: 1234 }       # LM Studio via host.docker.internal (Docker Desktop's host gateway)

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
