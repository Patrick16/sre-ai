# helm upgrade --install worker infra/helm/sandbox-service -n sandbox -f infra/helm/releases/sandbox/worker.yaml
replicas: 1

image:
  repository: sandbox/worker
  tag: "0.4.0"   # 0.3.0: OpenTelemetry metrics on :9090, JSON logs; 0.4.0: fault modes (Phase 9)

service:
  enabled: false   # nobody calls the worker

# Phase 9: chaos "bad modes", all off. Experiments switch them with --set (scripts/game-day.ps1).
faults:
  enabled: true

configEnv:
  Worker__IntervalSeconds: "5"
  OrdersApi__BaseUrl: "http://orders-api"

secretEnv:
  - name: OrdersApi__ApiKey
    secretName: sandbox-api-key
    key: api-key

networkPolicy:
  allowToApps:
    - app: orders-api                   # nobody calls the worker; it only calls orders-api

probes:
  readiness:
    enabled: false   # receives no traffic; liveness checks its own processing loop

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi
