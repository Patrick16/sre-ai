# helm upgrade --install frontend infra/helm/sandbox-service -n sandbox -f infra/helm/releases/sandbox/frontend.yaml
replicas: 2

image:
  repository: sandbox/frontend
  tag: "0.3.0"   # 0.3.0: OpenTelemetry metrics on :9090, JSON logs

# The user-facing SLO: includes the time frontend waits for orders-api.
slo:
  enabled: true
  objective: 0.99
  latencyThresholdSeconds: "0.5"

configEnv:
  Frontend__Greeting: "Hello from Kubernetes"
  OrdersApi__BaseUrl: "http://orders-api"

secretEnv:
  - name: OrdersApi__ApiKey
    secretName: sandbox-api-key
    key: api-key

networkPolicy:
  allowFromNamespaces: [traefik]        # users arrive through the Ingress Controller
  allowToApps:
    - app: orders-api

ingress:
  enabled: true
  host: sandbox.localhost
  path: /
  tls:
    secretName: sandbox-tls
    clusterIssuer: sandbox-ca
