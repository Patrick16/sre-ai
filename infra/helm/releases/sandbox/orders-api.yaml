# helm upgrade --install orders-api infra/helm/sandbox-service -n sandbox -f infra/helm/releases/sandbox/orders-api.yaml
replicas: 3

image:
  repository: sandbox/orders-api
  tag: "0.5.2"   # 0.5.2: pending orders older than 7 days are deleted; 0.5.1: code split into files (no behaviour change); 0.5.0: review fixes - 400 on a bad order, newest-first list, /debug behind the API key, retention, no dev secrets in the image; 0.2.x: PostgreSQL; 0.3.0: OpenTelemetry metrics on :9090, JSON logs; 0.3.1: no GSSAPI probing; 0.4.0: fault modes (Phase 9)

# 99% of requests must be non-5xx and faster than 250 ms (0.25 is a bucket boundary of http.server.request.duration).
slo:
  enabled: true
  objective: 0.99
  latencyThresholdSeconds: "0.25"

rollingUpdate:
  maxUnavailable: 0   # never drop below 3 ready pods during an update
  maxSurge: 1

spreadAcrossNodes: true

configFiles:
  mountPath: /app/config
  files:
    appsettings.k8s.json: |
      {
        "Orders": {
          "Banner": "orders-api running in kind"
        }
      }

# Phase 9: chaos "bad modes", all off. Experiments switch them with --set (scripts/game-day.ps1).
faults:
  enabled: true

configEnv:
  Orders__Db__Host: "postgres"        # Service of the postgres release
  Orders__Db__Database: "orders"
  Orders__Db__Username: "orders"
  Orders__PendingRetentionDays: "7"   # orders nobody processed for a week (worker gone) are deleted too
  Orders__RetentionHours: "24"        # processed orders older than a day are deleted (loadgen adds ~1 order/s)

secretEnv:
  - name: Orders__Db__Password
    secretName: postgres-credentials  # created by scripts/deploy-apps.ps1, shared with the postgres release
    key: password

secretFiles:
  - secretName: sandbox-api-key   # created by scripts/deploy-apps.ps1, not stored in git
    key: api-key
    mountPath: /etc/orders-api/secret

probes:
  startup:
    enabled: true

# Calls INTO orders-api from meshed clients (frontend, worker): GETs are retried on 5xx (e.g. the 503s
# while PostgreSQL restarts), writes are never retried. Traefik is not meshed, so /api/* gets neither.
mesh:
  routes:
    enabled: true

networkPolicy:
  allowFromApps: [frontend, worker]
  allowFromNamespaces: [traefik]        # https://sandbox.localhost/api
  allowToApps:
    - app: postgres
      port: postgres

ingress:
  enabled: true
  host: sandbox.localhost
  path: /api
  stripPrefix: true
  tls:
    secretName: sandbox-tls   # issued via the frontend Ingress; reused here
