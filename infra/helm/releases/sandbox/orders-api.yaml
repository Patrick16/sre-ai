# helm upgrade --install orders-api infra/helm/sandbox-service -n sandbox -f infra/helm/releases/sandbox/orders-api.yaml
replicas: 3

image:
  repository: sandbox/orders-api
  tag: "0.3.1"   # 0.2.x: PostgreSQL; 0.3.0: OpenTelemetry metrics on :9090, JSON logs; 0.3.1: no GSSAPI probing

# 99% of requests must be non-5xx and faster than 250 ms (0.25 is a bucket boundary of http.server.request.duration).
slo:
  enabled: true
  objective: 0.99
  latencyThresholdSeconds: "0.25"

rollingUpdate:
  maxUnavailable: 0   # never drop below 3 ready pods during an update
  maxSurge: 1

spreadAcrossNodes: true

configFiles:
  mountPath: /app/config
  files:
    appsettings.k8s.json: |
      {
        "Orders": {
          "Banner": "orders-api running in kind"
        }
      }

configEnv:
  Orders__Db__Host: "postgres"        # Service of the postgres release
  Orders__Db__Database: "orders"
  Orders__Db__Username: "orders"

secretEnv:
  - name: Orders__Db__Password
    secretName: postgres-credentials  # created by scripts/deploy-apps.ps1, shared with the postgres release
    key: password

secretFiles:
  - secretName: sandbox-api-key   # created by scripts/deploy-apps.ps1, not stored in git
    key: api-key
    mountPath: /etc/orders-api/secret

probes:
  startup:
    enabled: true

ingress:
  enabled: true
  host: sandbox.localhost
  path: /api
  stripPrefix: true
  tls:
    secretName: sandbox-tls   # issued via the frontend Ingress; reused here
