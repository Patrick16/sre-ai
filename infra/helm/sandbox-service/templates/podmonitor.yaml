{{- if and .Values.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "sandbox-service.name" . }}
  labels:
    {{- include "sandbox-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "sandbox-service.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: {{ .Values.metrics.path }}
      interval: 15s
      relabelings:
        # Stable, human-friendly labels on every series: app="orders-api", version="0.2.1".
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
{{- end }}
