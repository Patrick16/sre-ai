{{- if .Values.networkPolicy.enabled }}
{{- $name := include "sandbox-service.name" . -}}
{{- $np := .Values.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "sandbox-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sandbox-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.service.enabled }}
    - from:
        {{- range $np.allowFromApps }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
        {{- range $np.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        # the `helm test` pod of this release
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}-test
      ports:
        - port: http
        # Linkerd's inbound proxy port: meshed clients send opaque/multiplexed traffic straight to it.
        # Note: whoever reaches 4143 can reach ANY port of the pod through the proxy; fine-grained control
        # moves to Linkerd's identity-based authorization at this point.
        - port: 4143
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: metrics
    {{- end }}
  egress:
    # DNS is also allowed by the namespace baseline; repeated here so this policy works on its own.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- range $np.allowToApps }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .app }}
          {{- with .namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          {{- end }}
      ports:
        - port: {{ .port | default "http" }}
        - port: 4143   # the destination's Linkerd inbound proxy (meshed traffic)
    {{- end }}
    {{- range $np.allowToNamespaces }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
      ports:
        - port: {{ .port }}
        - port: 4143
    {{- end }}
    {{- range $np.allowToCidrs }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - port: {{ .port }}
    {{- end }}
{{- if .Values.service.enabled }}
---
# The `helm test` pod may only reach this release's pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-test
  labels:
    {{- include "sandbox-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}-test
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "sandbox-service.selectorLabels" . | nindent 14 }}
      ports:
        - port: http
        - port: 4143   # the test pod is meshed too: proxy-to-proxy traffic goes to the inbound proxy port
{{- end }}
{{- end }}
