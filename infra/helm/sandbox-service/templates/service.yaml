{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sandbox-service.name" . }}
  labels:
    {{- include "sandbox-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sandbox-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
