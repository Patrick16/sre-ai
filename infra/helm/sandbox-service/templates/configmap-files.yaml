{{- if .Values.configFiles.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sandbox-service.name" . }}-files
  labels:
    {{- include "sandbox-service.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.configFiles.files }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
