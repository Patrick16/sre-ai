apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: sandbox-manual
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: sandbox
data:
  Worker__IntervalSeconds: "5"
  OrdersApi__BaseUrl: "http://orders-api"
---
# No Service for the worker: nobody calls it. A Service is only needed to RECEIVE traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sandbox-manual
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: sandbox
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: sandbox/worker:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080   # only for probes (and metrics in Phase 5)
          envFrom:
            - configMapRef:
                name: worker-config
          env:
            - name: OrdersApi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: sandbox-api-key
                  key: api-key
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Checks that the processing loop is still turning (not whether orders-api is up).
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
