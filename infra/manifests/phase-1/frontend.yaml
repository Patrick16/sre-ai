# Injected as ENV variables (envFrom): a running pod never sees edits; it needs a restart.
# "__" in a key is how .NET maps env vars to nested config: OrdersApi__BaseUrl -> OrdersApi:BaseUrl.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: sandbox
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sandbox
data:
  Frontend__Greeting: "Hello from Kubernetes"
  OrdersApi__BaseUrl: "http://orders-api"   # Service DNS name; full form: orders-api.sandbox.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sandbox
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: sandbox
        app.kubernetes.io/version: "0.1.0"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: sandbox/frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontend-config
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: OrdersApi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: sandbox-api-key
                  key: api-key
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sandbox
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sandbox
spec:
  type: ClusterIP   # reached via kubectl port-forward for now; Ingress in Phase 2
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
