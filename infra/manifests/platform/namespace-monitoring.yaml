apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter and the log collector read the host (hostNetwork, hostPID, /proc, /var/log):
    # that is exactly what Pod Security "restricted"/"baseline" forbid, so this namespace is "privileged".
    # Keep it for infrastructure only; never run apps here.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent
  annotations:
    linkerd.io/inject: enabled
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
