# A private CA, the way internal TLS is usually done in companies:
#   selfsigned (bootstrap only) --signs--> sandbox-root-ca (CA certificate) --> ClusterIssuer sandbox-ca --signs--> app certificates
# Trust sandbox-root-ca once, and every certificate issued by sandbox-ca is trusted.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-root-ca
  namespace: cert-manager   # a ClusterIssuer reads its CA secret from cert-manager's own namespace
spec:
  isCA: true
  commonName: sre-ai sandbox root CA
  secretName: sandbox-root-ca
  duration: 87600h      # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sandbox-ca
spec:
  ca:
    secretName: sandbox-root-ca
