# https://sandbox.localhost/      -> Service frontend
# https://sandbox.localhost/api/* -> Service orders-api (with "/api" stripped)
# *.localhost resolves to 127.0.0.1 in browsers and curl, so no hosts-file edit is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: sandbox
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: sandbox
  annotations:
    # cert-manager sees this, creates a Certificate, and stores the signed cert in secret sandbox-tls.
    cert-manager.io/cluster-issuer: sandbox-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sandbox.localhost]
      secretName: sandbox-tls
  rules:
    - host: sandbox.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# Controller-specific feature: stripping a path prefix is not part of the Ingress spec,
# so each controller does it its own way (here: a Traefik Middleware CRD + annotation).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: sandbox
spec:
  stripPrefix:
    prefixes: [/api]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-api
  namespace: sandbox
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: sandbox
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # <namespace>-<name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: sandbox-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    # Reuses the certificate issued for the frontend Ingress (same host); no cert-manager annotation here,
    # otherwise two Certificates would fight over one secret.
    - hosts: [sandbox.localhost]
      secretName: sandbox-tls
  rules:
    - host: sandbox.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  name: http
