# Local cluster: 1 control-plane + 2 workers.
# Two workers so that scheduling, pod spreading and "a node went down" are observable.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sre-ai
nodes:
  - role: control-plane
    # ingress-nginx's kind manifest schedules the controller only on nodes with this label.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Host ports 80/443 -> this node, so https://sandbox.local reaches the Ingress Controller (Phase 2).
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
